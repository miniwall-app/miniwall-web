name: CI

# Manual only for now. The Web SDK installs @miniwall/render from npm and that package is not published yet, so an install here
# would fail. When it is published, add the `push` and `pull_request` triggers back (see README).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, typecheck, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm --filter @miniwall/react typecheck
      - run: pnpm --filter @miniwall/react test
